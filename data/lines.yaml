# Product lines ("artists") on the LatinCy label — apparatus only, no prose.
#
# Each line groups artifacts whose releases become catalog albums
# (album key = line@MAJOR.x by default, line@MAJOR.MINOR for album_scheme: minor;
#  a whole 0.x series = one album).
#
#   kind      display kind (spaCy Pipeline, Vectors, PyPI Package, …)
#   language  la | grc
#   formats   size/variant name -> HF repo id (multi-format lines)
#   hf        single HF repo id
#   pypi      PyPI project name
#   github    owner/repo
#   include   true | false | review   (review = Patrick decides, see proposal)
#   manual    pressings evidenced outside HF/PyPI/GitHub-tags (each needs a source)

lines:
  la_core_web:
    album_scheme: minor   # 3.x lockstep: one number per minor
    kind: spaCy Pipeline
    language: la
    formats:
      sm: latincy/la_core_web_sm
      md: latincy/la_core_web_md
      lg: latincy/la_core_web_lg
      trf: latincy/la_core_web_trf
    legacy_hf: [diyclassics/la_core_web_md]
    github: diyclassics/la_core_web_lg
    include: true
    upload_pressings: false
    manual:
      - {version: "3.5.2", date: 2023-05-04, formats: [md], source: "https://huggingface.co/diyclassics/la_core_web_md/commit/e8c6ad4f9b92"}
      - {version: "3.6", date: 2023-07-10, formats: [], evidence: training-repo, source: "https://github.com/diyclassics/la_core_web_lg/commit/89a5fda0b6"}
      - {version: "3.7.5", date: 2024-07-03, formats: [], evidence: training-repo, source: "https://github.com/diyclassics/la_core_web_lg/commit/b8f7527e02"}
      - {version: "3.7.6", date: 2024-07-25, formats: [], evidence: training-repo, source: "https://github.com/diyclassics/la_core_web_lg/commit/5519310878"}
      - {version: "3.7.7", date: 2024-08-01, formats: [], evidence: training-repo, source: "https://github.com/diyclassics/la_core_web_lg/commit/7b0bfb35f2"}
      - {version: "3.8.0", date: 2024-12-27, formats: [sm, md, lg, trf], evidence: inferred, source: "https://huggingface.co/latincy/la_senter/commit/2e923c1c38b1"}
      - {version: "3.9.0", date: 2026-03-17, formats: [sm, md, lg], evidence: local-log, source: "latincy-pipelines/.claude/project_log/2026-03-17.md"}  # HF repos re-created 2026-03-25 (commit 121e030781c9); Patrick chose the log date 2026-10-01
      - {version: "3.9.1", date: 2026-03-25, formats: [trf], source: "https://huggingface.co/latincy/la_core_web_trf/commit/9208ad6c7ac5"}

  la_senter:
    album_scheme: minor   # 3.x lockstep: one number per minor
    kind: spaCy Model
    language: la
    hf: latincy/la_senter
    legacy_hf: [diyclassics/la_senter]
    include: true
    manual:
      - {version: null, album: "pre-3.8", date: 2022-12-23, formats: [], source: "https://huggingface.co/diyclassics/la_senter/commit/4dd7cbc2ee21"}
      - {version: null, album: "pre-3.8", date: 2023-03-11, formats: [], source: "https://huggingface.co/diyclassics/la_senter/commit/374a3bf9ec9e"}
      - {version: null, album: "pre-3.8", date: 2023-03-15, formats: [], source: "https://huggingface.co/diyclassics/la_senter/commit/f17aa6a0a07f"}

  la_vectors_floret:
